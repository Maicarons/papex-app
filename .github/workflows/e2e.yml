name: E2E

on:
  push:
    tags: ['v*']
  pull_request:
    types: [labeled]

jobs:
  ios:
    if: ${{ github.event_name == 'push' || github.event.label.name == 'e2e' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run e2e:ios
  android:
    if: ${{ github.event_name == 'push' || github.event.label.name == 'e2e' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run e2e:android
